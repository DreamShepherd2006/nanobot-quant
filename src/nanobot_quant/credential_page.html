<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 凭证管理 — 业务管理</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: -apple-system, sans-serif; background:#f5f5f5; color:#333; padding:20px; max-width:680px; margin:0 auto; }
  h1 { font-size:1.4em; margin-bottom:6px; }
  .subtitle { color:#888; font-size:.88em; margin-bottom:20px; }
  .card { background:#fff; border-radius:8px; padding:16px; margin-bottom:12px; border:1px solid #e0e0e0; }
  .card-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .card-header .icon { font-size:1.3em; }
  .card-header .name { font-weight:600; font-size:1.05em; }
  .card-header .status { margin-left:auto; font-size:.82em; padding:3px 10px; border-radius:4px; }
  .status-configured { background:#e8f5e9; color:#2e7d32; }
  .status-pending { background:#fff3e0; color:#e65100; }
  .card-desc { color:#666; font-size:.88em; margin-bottom:10px; }
  .card-actions { display:flex; gap:8px; }
  button { padding:8px 18px; border:none; border-radius:6px; font-size:.9em; cursor:pointer; font-weight:500; }
  .btn-primary { background:#1565c0; color:#fff; }
  .btn-primary:hover { background:#0d47a1; }
  .btn-outline { background:#fff; color:#1565c0; border:1px solid #1565c0; }
  .btn-outline:hover { background:#e3f2fd; }
  .empty { text-align:center; color:#999; padding:40px 20px; }
  .note { background:#e3f2fd; border:1px solid #90caf9; border-radius:6px; padding:10px 14px; margin:16px 0; font-size:.88em; color:#1565c0; }
  .err { background:#fce4ec; border:1px solid #ef9a9a; color:#c62828; border-radius:6px; padding:10px 14px; margin:12px 0; font-size:.88em; }
  .ok { background:#e8f5e9; border:1px solid #a5d6a7; color:#2e7d32; border-radius:6px; padding:10px 14px; margin:12px 0; font-size:.88em; }
  a { color:#1565c0; text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<h1>🔑 API 凭证管理</h1>
<p class="subtitle">管理交易所、数据源的 API 凭证。保存后即时生效，无需重启。</p>
{cards_html}
<div id="global-msg"></div>
</body>
</html>
