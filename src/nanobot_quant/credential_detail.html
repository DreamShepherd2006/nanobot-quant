<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 凭证管理 — 业务管理</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: -apple-system, sans-serif; background:#f5f5f5; color:#333; padding:20px; max-width:680px; margin:0 auto; }
  h1 { font-size:1.4em; margin-bottom:16px; }
  h2 { font-size:1.1em; margin:24px 0 12px; }
  .card { background:#fff; border-radius:8px; padding:16px; margin-bottom:12px; border:1px solid #e0e0e0; }
  .card-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .card-header .icon { font-size:1.3em; }
  .card-header .name { font-weight:600; font-size:1.05em; }
  .card-header .status { margin-left:auto; font-size:.82em; padding:3px 10px; border-radius:4px; }
  .status-configured { background:#e8f5e9; color:#2e7d32; }
  .status-pending { background:#fff3e0; color:#e65100; }
  .card-desc { color:#666; font-size:.88em; margin-bottom:10px; }
  .card-actions { display:flex; gap:8px; }
  button { padding:8px 18px; border:none; border-radius:6px; font-size:.9em; cursor:pointer; font-weight:500; }
  .btn-primary { background:#1565c0; color:#fff; }
  .btn-primary:hover { background:#0d47a1; }
  .btn-outline { background:#fff; color:#1565c0; border:1px solid #1565c0; }
  .btn-outline:hover { background:#e3f2fd; }
  .btn-danger { background:none; border:1px solid #e53935; color:#e53935; }
  .btn-danger:hover { background:#ffebee; }
  .form-group { margin-bottom:12px; }
  .cred-group { background:#fff; border:1px solid #e0e0e0; border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .cred-group-title { font-weight:700; font-size:.95em; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #eee; }
  .cred-group-body .form-group:last-child { margin-bottom:0; }
  label { display:block; margin-bottom:4px; font-weight:600; font-size:.88em; }
  input, select { width:100%; padding:9px 12px; border:1px solid #ddd; border-radius:6px; font-size:.9em; }
  input[readonly], input:disabled { background:#f5f5f5; color:#666; }
  .note { background:#e3f2fd; border:1px solid #90caf9; border-radius:6px; padding:10px 14px; margin:16px 0; font-size:.88em; color:#1565c0; }
  .err { background:#fce4ec; border:1px solid #ef9a9a; color:#c62828; border-radius:6px; padding:10px 14px; margin:12px 0; font-size:.88em; }
  .ok { background:#e8f5e9; border:1px solid #a5d6a7; color:#2e7d32; border-radius:6px; padding:10px 14px; margin:12px 0; font-size:.88em; }
  a { color:#1565c0; }
  .back-link { display:inline-block; margin-bottom:16px; color:#666; font-size:.88em; text-decoration:none; }
  .back-link:hover { color:#333; }
  .field-help { color:#999; font-size:.78em; margin-top:2px; }
  .flex-row { display:flex; gap:8px; align-items:center; }
  .flex-row button { flex-shrink:0; }
  .saved-mask { opacity:.7; pointer-events:none; }
</style>
</head>
<body>
<a class="back-link" href="/config/credentials">← 返回列表</a>
<h1>🔑 {display}</h1>
<p style="color:#666;font-size:.9em;margin-bottom:8px">{description}</p>
{docs_block}
<form id="credForm" onsubmit="saveCred(event)">
  {fields_html}
  {extra_html}
  <div style="margin-top:16px;display:flex;gap:8px;">
    <button type="submit" class="btn-primary">💾 保存</button>
    <button type="button" class="btn-danger" onclick="deleteCred()">🗑️ 删除</button>
  </div>
  <div id="form-msg" style="margin-top:12px;"></div>
</form>
<script>
const credName = CRED_NAME_PLACEHOLDER;

async function saveCred(e) {
  e.preventDefault();
  const data = {};
  document.querySelectorAll('#credForm input, #credForm select').forEach(inp => {
    if (inp.disabled) return;  // readonly display-only fields: never saved
    data[inp.name] = inp.value;
  });
  const resp = await fetch('/config/credentials/' + credName + '/save', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
  });
  const result = await resp.json();
  const el = document.getElementById('form-msg');
  if (result.ok) {
    el.innerHTML = '<div class="ok">✅ 保存成功。凭证已生效。</div>';
  } else {
    el.innerHTML = '<div class="err">❌ ' + (result.error || '保存失败') + '</div>';
  }
}

async function deleteCred() {
  if (!confirm('确定要删除此凭证吗？')) return;
  const resp = await fetch('/config/credentials/' + credName, {method:'DELETE'});
  const result = await resp.json();
  const el = document.getElementById('form-msg');
  if (result.ok) {
    el.innerHTML = '<div class="ok">✅ 已删除。3秒后返回列表…</div>';
    // Clear all input fields
    document.querySelectorAll('#credForm input').forEach(inp => { inp.value = ''; });
    setTimeout(() => { window.location.href = '/config/credentials'; }, 3000);
  } else {
    el.innerHTML = '<div class="err">❌ ' + (result.error || '删除失败') + '</div>';
  }
}
</script>
</body>
</html>
