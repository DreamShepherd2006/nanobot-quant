[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobot-quant"
version = "1.0.0"
description = "AI 量化交易 Squad agent 部署层"
requires-python = ">=3.12"
dependencies = [
    "gate-api==7.2.123",
    "okx==1.0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanobot_quant = ["skills/**/*", "*.html", "environment/*.json"]

# Legion Module：网关（nanobot-legion）通过该 entry point 发现本模块
[project.entry-points."nanobot_legion.modules"]
quant = "nanobot_quant.legion_plugin:MODULE"
